service: edurain-api
useDotenv: true

provider:
  name: aws
  runtime: nodejs20.x
  region: ap-south-1
  environment:
    DATABASE_URL: ${env:DATABASE_URL, ''}
    RAZORPAY_KEY_ID: ${env:RAZORPAY_KEY_ID, ''}
    RAZORPAY_KEY_SECRET: ${env:RAZORPAY_KEY_SECRET, ''}
    NODE_ENV: production
    RAZORPAY_WEBHOOK_SECRET: ${env:RAZORPAY_WEBHOOK_SECRET, ''}
    CRON_SECRET: ${env:CRON_SECRET, ''}
    SLACK_WEBHOOK_URL: ${env:SLACK_WEBHOOK_URL, ''}
    ALERT_WEBHOOK_URL: ${env:ALERT_WEBHOOK_URL, ''}
    CORS_ORIGINS: ${env:CORS_ORIGINS, ''}
    PUBLIC_BASE_URL: ${env:PUBLIC_BASE_URL, ''}
    FIREBASE_SERVICE_ACCOUNT: ${env:FIREBASE_SERVICE_ACCOUNT, ''}
    # Live doubt chat signals (lib/ticketSignals.ts), e.g. https://<project>-default-rtdb.asia-southeast1.firebasedatabase.app
    FIREBASE_DATABASE_URL: ${env:FIREBASE_DATABASE_URL, ''}
    AWS_S3_BUCKET_NAME: ${env:AWS_S3_BUCKET_NAME, ''}
    BUNNY_STREAM_LIBRARY_ID: ${env:BUNNY_STREAM_LIBRARY_ID, ''}
    BUNNY_STREAM_API_KEY: ${env:BUNNY_STREAM_API_KEY, ''}
    BUNNY_STREAM_CDN_HOSTNAME: ${env:BUNNY_STREAM_CDN_HOSTNAME, ''}
    GOOGLE_PLAY_PACKAGE_NAME: ${env:GOOGLE_PLAY_PACKAGE_NAME, 'com.edurainindia.app'}
    GOOGLE_PLAY_SERVICE_ACCOUNT: ${env:GOOGLE_PLAY_SERVICE_ACCOUNT, ''}
    MSG91_AUTH_KEY: ${env:MSG91_AUTH_KEY, ''}
    REDIS_URL: ${env:REDIS_URL, ''}
    # Used by the code but missing here: a deploy replaces the Lambda's variables with this list, so a value
    # typed into the AWS console was wiped by the next deploy. Empty means the code's default.
    GEMINI_API_KEY: ${env:GEMINI_API_KEY, ''}
    GEMINI_MODEL: ${env:GEMINI_MODEL, ''}
    SUPER_ADMIN_EMAIL: ${env:SUPER_ADMIN_EMAIL, ''}
    APP_TIME_ZONE: ${env:APP_TIME_ZONE, 'Asia/Kolkata'}
    APP_MIN_VERSION: ${env:APP_MIN_VERSION, ''}
    APP_LATEST_VERSION: ${env:APP_LATEST_VERSION, ''}
    EXPO_ACCESS_TOKEN: ${env:EXPO_ACCESS_TOKEN, ''}
    CACHE_EPOCH: ${env:CACHE_EPOCH, '1'}
    CACHE_ENABLED: ${env:CACHE_ENABLED, 'true'}
    CACHE_BYPASS: ${env:CACHE_BYPASS, 'false'}
    SYNC_ENABLED: ${env:SYNC_ENABLED, 'true'}
    SYNC_NEXT_SECONDS: ${env:SYNC_NEXT_SECONDS, '15'}
    SYNC_ROLLOUT_PERCENT: ${env:SYNC_ROLLOUT_PERCENT, '100'}
    DB_FETCH_GLOBAL_CAP: ${env:DB_FETCH_GLOBAL_CAP, '25'}
    DB_POOL_MAX: ${env:DB_POOL_MAX, '2'}
    DB_CONNECT_TIMEOUT_MS: ${env:DB_CONNECT_TIMEOUT_MS, '5000'}
  vpc:
    securityGroupIds:
      - sg-0c07d868d37903d36
    subnetIds:
      - subnet-075e2e2d787f424a9
  iam:
    role:
      statements:
        - Effect: Allow
          Action:
            - s3:PutObject
            - s3:GetObject
            - s3:DeleteObject
          Resource: "arn:aws:s3:::edurain-media-v2/*"


package:
  patterns:
    - '!**'
    - 'dist/**'
    - '.env'
    - 'firebase-service-account.json'

functions:
  api:
    handler: dist/lambda.handler
    # API Gateway ends every request at 30 s; the default 6 s cut off heavy CMS requests (uploads, reports)
    timeout: 29
    events:
      - httpApi: '*'
  # Safety nets for pending payments. Same code, a longer timeout than a web request gets.
  paymentJobs:
    handler: dist/lambda.handler
    timeout: 120
    events:
      - schedule:
          rate: rate(5 minutes)
          input:
            task: sweep
      - schedule:
          rate: rate(1 hour)
          input:
            task: reconcile
      # Notifications for big audiences (CMS announcements, tests, live classes), queued by lib/expoPush.ts
      - schedule:
          rate: rate(1 minute)
          input:
            task: push
